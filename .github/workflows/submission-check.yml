name: submission-check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Path ownership (gate G2)
        if: ${{ !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) }}
        run: |
          python scripts/check_pr_paths.py --author "${{ github.event.pull_request.user.login }}" \
            --base "origin/${{ github.base_ref }}" --out changed_packages.txt
      - name: List changed packages (maintainers)
        if: ${{ contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) }}
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | awk -F/ '$1=="submissions" && NF>3 {print $1"/"$2"/"$3}' | sort -u > changed_packages.txt
          cat changed_packages.txt
      - name: Twelve gates
        run: |
          status=0
          while read -r pkg; do
            [ -z "$pkg" ] && continue
            [ -f "$pkg/manifest.json" ] || { echo "no manifest.json in $pkg"; status=1; continue; }
            python scripts/self_check_submission.py --no-write "$pkg" || status=1
          done < changed_packages.txt
          exit $status

  main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Every package
        run: python scripts/self_check_submission.py --all --no-write
